<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111f30">
  <meta name="description" content="L'AIGUILLEUR — railway incident supervision and decision support.">
  <title>L'AIGUILLEUR · Railway supervision</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="rail" aria-label="Main navigation">
      <a class="brand" href="#incidents" aria-label="L'AIGUILLEUR, ongoing incidents">L'<span>AI</span>GUILLEUR<span class="brand-sub">RAILWAY SUPERVISION</span></a>
      <div class="rail-label">OPERATIONS SPACE</div>
      <button class="rail-link active" data-action="incidents" aria-label="Ongoing incidents"><span data-icon="route"></span><span>Ongoing incidents</span><span id="nav-count" class="rail-count">—</span></button>
      <button class="rail-link" data-action="rex" aria-label="REX — Lessons learned"><span data-icon="history"></span><span>REX</span><span id="rex-count" class="rail-count">—</span></button>
      <div class="rail-bottom"><div class="rail-rule"></div><span class="rail-caption">The right information.<br>At the right time.</span><div class="rail-signature">DECISION SUPPORT</div></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb"><span data-icon="route"></span><span>Operations</span><span class="slash">/</span><strong id="breadcrumb-label">Ongoing incidents</strong></div><div class="topbar-right"><span class="live-dot"></span><span>Supervision center</span><time id="clock"></time></div></header>
      <main id="main" tabindex="-1" aria-label="Incident supervision"><div class="initial-loading" role="status"><span class="spinner"></span>Connecting to the supervision center…</div></main>
      <footer class="statusbar"><span id="connection-status">Connecting to backend…</span><span id="config-status">AI configuration pending</span><button class="text-button" data-action="reload-config">Refresh connection</button></footer>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <noscript><div class="noscript">JavaScript is required to view incidents and use calls.</div></noscript>
</body>
</html>
