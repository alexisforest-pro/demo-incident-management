[project]
name = "demo-aiguilleur"
version = "0.1.0"
description = "A Mistral Workflows project"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.0.0,<4",
    "pydantic",
    "python-dotenv",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "duckdb>=1.4,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "semgrep>=1.0",
    "pytest>=8.0",
    "watchdog>=4.0",
]

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "worker"]
